<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença</title>
</head>

<body>

    <h1>Confirmação de presença</h1>

    <p>
        Para confirmar sua presença, precisamos verificar sua localização.
    </p>

    <button onclick="capturarLocalizacao()">
        Permitir localização
    </button>

    <p id="status"></p>

    <script>

        // COLE A URL DO SEU APPS SCRIPT ENTRE AS ASPAS ABAIXO
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbywOdcJCagp-6zQY4SJfxNuuS_4XDhKB_FIQL3zkxcLnqwVvL1j9TV5Jhyi3TQNl6Ny/exec";

        function capturarLocalizacao() {

            const status = document.getElementById("status");

            status.innerText = "Obtendo sua localização...";

            if (!navigator.geolocation) {

                status.innerText =
                    "Seu navegador não suporta localização.";

                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const precisao = position.coords.accuracy;

                    const dados = {
                        latitude: latitude,
                        longitude: longitude,
                        precisao: precisao
                    };

                    status.innerText =
                        "Localização obtida! Registrando...";

                    fetch(URL_APPS_SCRIPT, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8"
                        },
                        body: JSON.stringify(dados)
                    })
                    .then(function() {

                        status.innerText =
                            "Localização registrada com sucesso!";

                    })
                    .catch(function() {

                        status.innerText =
                            "Não foi possível registrar a localização.";

                    });

                },

                function(error) {

                    status.innerText =
                        "Não foi possível obter sua localização. " +
                        "Permita o acesso à localização para continuar.";

                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );
        }

    </script>

</body>
</html>
</html>
