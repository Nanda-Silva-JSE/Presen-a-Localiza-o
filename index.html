<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença</title>
</head>

<body>

    <h1>Confirmação de presença</h1>

    <p>
        Para confirmar sua presença, precisamos verificar sua localização.
    </p>

    <button id="botaoLocalizacao" onclick="capturarLocalizacao()">
        Permitir localização
    </button>

    <p id="status"></p>


    <script>



        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbywOdcJCagp-6zQY4SJfxNuuS_4XDhKB_FIQL3zkxcLnqwVvL1j9TV5Jhyi3TQNl6Ny/exec";




        const URL_FORMS = "https://forms.cloud.microsoft/r/diU08HCnV5";


        function capturarLocalizacao() {

            const status =
                document.getElementById("status");

            const botao =
                document.getElementById("botaoLocalizacao");


            status.innerText =
                "Obtendo sua localização...";

            botao.disabled = true;


            if (!navigator.geolocation) {

                status.innerText =
                    "Seu navegador não suporta localização.";

                botao.disabled = false;

                return;
            }


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    const precisao =
                        position.coords.accuracy;


                    const dados = {

                        latitude: latitude,

                        longitude: longitude,

                        precisao: precisao

                    };


                    status.innerText =
                        "Localização obtida! Registrando...";


                    fetch(URL_APPS_SCRIPT, {

                        method: "POST",

                        mode: "no-cors",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body: JSON.stringify(dados)

                    })


                    .then(function() {

                        status.innerText =
                            "✅ Localização registrada!";


                        /*
                         * Cria o botão para continuar
                         * para o Microsoft Forms.
                         */

                        const botaoForms =
                            document.createElement("button");


                        botaoForms.innerText =
                            "Continuar para o formulário";


                        botaoForms.style.display =
                            "block";


                        botaoForms.style.marginTop =
                            "20px";


                        botaoForms.onclick =
                            function() {

                                window.location.assign(
                                    URL_FORMS
                                );

                            };


                        document.body.appendChild(
                            botaoForms
                        );

                    })


                    .catch(function() {

                        status.innerText =
                            "❌ Não foi possível registrar a localização.";

                        botao.disabled = false;

                    });

                },


                function(error) {

                    status.innerText =
                        "❌ Não foi possível obter sua localização. " +
                        "Permita o acesso à localização para continuar.";

                    botao.disabled = false;

                },


                {

                    enableHighAccuracy: true,

                    timeout: 15000,

                    maximumAge: 0

                }

            );

        }

    </script>

</body>

</html>
