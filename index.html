<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença</title>
</head>

<body>

    <h1>Confirmação de presença</h1>

    <p>
        Para confirmar sua presença, precisamos verificar sua localização.
    </p>

    <button onclick="capturarLocalizacao()">
        Permitir localização
    </button>

    <p id="status"></p>

    <script>

        function capturarLocalizacao() {

            const status = document.getElementById("status");

            status.innerText = "Obtendo sua localização...";

            if (!navigator.geolocation) {

                status.innerText =
                    "Seu navegador não suporta localização.";

                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const precisao = position.coords.accuracy;

                    // Link do Google Maps gerado internamente
                    const linkGoogleMaps =
                        "https://www.google.com/maps/search/?api=1&query="
                        + latitude + "," + longitude;

                    // Dados disponíveis para usarmos posteriormente
                    console.log("Latitude:", latitude);
                    console.log("Longitude:", longitude);
                    console.log("Precisão:", precisao);
                    console.log("Google Maps:", linkGoogleMaps);

                    status.innerText =
                        "Localização obtida com sucesso!";

                },

                function(error) {

                    status.innerText =
                        "Não foi possível obter sua localização. " +
                        "Permita o acesso à localização para continuar.";

                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );
        }

    </script>

</body>
</html>
</html>
